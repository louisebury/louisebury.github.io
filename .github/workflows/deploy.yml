# Publie le site sur GitHub Pages à chaque « git push » sur la branche main.
name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # permet aussi de relancer à la main depuis l'onglet « Actions »

# Droits nécessaires pour publier sur GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Si deux pushs arrivent coup sur coup, on ne garde que le plus récent
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire le site
        run: npm run build

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v6

      - name: Préparer le dossier dist pour la publication
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v5
