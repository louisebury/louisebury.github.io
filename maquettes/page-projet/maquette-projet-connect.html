  // changements ponctuels et frappe au clavier, dans l&#x27;ordre chronologique
  for (const ev of EVTS){ if (ev[0] &gt; t) break;
    if (ev[1] === &#x27;set&#x27;) ecrire(ev[2], ev[3], ev[4]);
    else { const [s,, d, id, txt] = ev; ecrire(id, &#x27;text&#x27;, txt.slice(0, Math.round(Math.min(1, (t - s) / d) * txt.length))); } }
  // pistes animées
  for (const tr of Object.values(D.tracks)){
    const v = valeur(tr.keys, t), e = $(tr.el); if (!e) continue;
    if (tr.kind===&#x27;ty&#x27;) e.setAttribute(&#x27;transform&#x27;, `translate(0 ${-v})`);
    else if (tr.kind===&#x27;y&#x27;) e.setAttribute(&#x27;transform&#x27;, `translate(0 ${v})`);
    else if (tr.kind===&#x27;tx&#x27;) e.setAttribute(&#x27;transform&#x27;, `translate(${v} 0)`);
    else if (tr.kind===&#x27;op&#x27;) e.setAttribute(&#x27;opacity&#x27;, v);
    else if (tr.kind===&#x27;r&#x27;) e.setAttribute(&#x27;r&#x27;, v);
    else if (tr.kind===&#x27;dash&#x27;) e.setAttribute(&#x27;stroke-dashoffset&#x27;, v);
    else if (tr.kind===&#x27;rot&#x27;) e.setAttribute(&#x27;transform&#x27;, `rotate(${v} ${tr.cx} ${tr.cy})`);
    else if (tr.kind===&#x27;cursor&#x27;) e.setAttribute(&#x27;transform&#x27;, `translate(${v[0]} ${v[1]})`);
  }
  // onde de clic
  const c = $(&#x27;clic&#x27;); c.setAttribute(&#x27;opacity&#x27;, 0);
  D.clicks.forEach(([tc]) =&gt; { const p = (t - tc) / 0.45; if (p &gt;= 0 &amp;&amp; p &lt;= 1){ c.setAttribute(&#x27;r&#x27;, 4 + 16*p); c.setAttribute(&#x27;opacity&#x27;, 1 - p); } });
  document.querySelector(&#x27;#prog i&#x27;).style.width = (100 * t / D.total) + &#x27;%&#x27;;
}

let t = 0, lecture = true, avant = null;
const reduit = window.matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches;
function boucle(ts){
  if (avant !== null &amp;&amp; lecture){ t += (ts - avant) / 1000; if (t &gt; D.total + 1.5) t = 0; }
  avant = ts; rendu(Math.min(t, D.total)); requestAnimationFrame(boucle);
}
function majBouton(){ $(&#x27;lecture&#x27;).textContent = lecture ? &#x27;⏸ Pause&#x27; : &#x27;▶ Lecture&#x27;; $(&#x27;lecture&#x27;).setAttribute(&#x27;aria-label&#x27;, lecture ? &#x27;Pause&#x27; : &#x27;Lecture&#x27;); }
$(&#x27;lecture&#x27;).onclick = () =&gt; { lecture = !lecture; majBouton(); };
$(&#x27;prog&#x27;).onclick = e =&gt; { const r = e.currentTarget.getBoundingClientRect(); t = D.total * (e.clientX - r.left) / r.width; };
window.seek = s =&gt; { t = s; lecture = false; rendu(s); };   // utile pour les tests et l&#x27;intégration
if (reduit){ lecture = false; t = D.total; majBouton(); }   // image finale, sans mouvement
requestAnimationFrame(boucle);
&lt;/script&gt;

t;#FFFFFF&quot; fill-opacity=&quot;1&quot; text-anchor=&quot;start&quot; letter-spacing=&quot;0&quot;&gt;&lt;/text&gt;&lt;/g&gt;&lt;/g&gt;&lt;g id=&quot;curseur&quot;&gt;&lt;circle id=&quot;clic&quot; cx=&quot;0&quot; cy=&quot;0&quot; r=&quot;0&quot; fill=&quot;#F25C54&quot; fill-opacity=&quot;0.25&quot; stroke=&quot;#F25C54&quot; stroke-width=&quot;2&quot; opacity=&quot;0&quot;/&gt;&lt;path d=&quot;M0 0 L0 20 L5.5 15 L9 23 L12.5 21.5 L9 14 L16 14 Z&quot; fill=&quot;#FFFFFF&quot; stroke=&quot;#111&quot; stroke-width=&quot;1.3&quot; stroke-linejoin=&quot;round&quot;/&gt;&lt;/g&gt;&lt;/svg&gt;&lt;/div&gt;

const D = {&quot;total&quot;: 20.72, &quot;sets&quot;: [[1.75, &quot;r-pick-ph&quot;, &quot;display&quot;, &quot;none&quot;], [2.567, &quot;r-liste-tous&quot;, &quot;display&quot;, &quot;none&quot;], [2.567, &quot;r-liste-fr13&quot;, &quot;display&quot;, &quot;&quot;], [2.567, &quot;r-compte&quot;, &quot;text&quot;, &quot;3 lots disponibles&quot;], [4.217, &quot;toast-t&quot;, &quot;text&quot;, &quot;Recherche sauvegardée : alerte e-mail activée&quot;], [7.467, &quot;r-liste-fr13&quot;, &quot;display&quot;, &quot;none&quot;], [7.467, &quot;r-liste-compacte&quot;, &quot;display&quot;, &quot;&quot;], [9.117, &quot;o-prix-ph&quot;, &quot;display&quot;, &quot;none&quot;], [11.317, &quot;toast-t&quot;, &quot;text&quot;, &quot;Offre envoyée : le chargeur est notifié&quot;]], &quot;types&quot;: [[1.75, 0.667, &quot;r-pick&quot;, &quot;FR13&quot;], [9.117, 1.0, &quot;o-prix&quot;, &quot;1 250 €&quot;]], &quot;screens&quot;: [[0.0, &quot;s-search&quot;], [14.367, &quot;s-offers&quot;]], &quot;clicks&quot;: [[1.4, 152, 302.0], [3.867, 215.0, 520.0], [7.117, 1126.0, 289.0], [8.767, 904, 388.0], [10.967, 1015.0, 716.0], [14.017, 502.4, 152], [15.967, 900, 337]], &quot;tracks&quot;: {&quot;curseur&quot;: {&quot;el&quot;: &quot;curseur&quot;, &quot;kind&quot;: &quot;cursor&quot;, &quot;keys&quot;: [[0, [1020, 660]], [0.6, [1020, 660]], [1.4, [152, 302.0]], [3.167, [152, 302.0]], [3.867, [215.0, 520.0]], [6.317, [215.0, 520.0]], [7.117, [1126.0, 289.0]], [8.167, [1126.0, 289.0]], [8.767, [904, 388.0]], [10.267, [904, 388.0]], [10.967, [1015.0, 716.0]], [13.217, [1015.0, 716.0]], [14.017, [502.4, 152]], [15.167, [502.4, 152]], [15.967, [900, 337]], [17.117, [900, 337]], [18.017, [1040.0, 736.0]]]}, &quot;toast&quot;: {&quot;el&quot;: &quot;toast&quot;, &quot;kind&quot;: &quot;op&quot;, &quot;keys&quot;: [[0, 0], [4.217, 0], [4.517, 1], [6.617, 1], [7.017, 0], [11.317, 0], [11.617, 1], [13.717, 1], [14.117, 0]]}, &quot;toast-y&quot;: {&quot;el&quot;: &quot;toast-pos&quot;, &quot;kind&quot;: &quot;y&quot;, &quot;keys&quot;: [[0, 12], [4.217, 12], [4.517, 0], [7.017, 0], [7.027, 12], [11.317, 12], [11.617, 0], [14.117, 0], [14.127, 12]]}, &quot;s-search&quot;: {&quot;el&quot;: &quot;s-search-defil&quot;, &quot;kind&quot;: &quot;ty&quot;, &quot;keys&quot;: [[0, 0]]}, &quot;s-offers&quot;: {&quot;el&quot;: &quot;s-offers-defil&quot;, &quot;kind&quot;: &quot;ty&quot;, &quot;keys&quot;: [[0, 0]]}, &quot;drawer1&quot;: {&quot;el&quot;: &quot;drawer1&quot;, &quot;kind&quot;: &quot;tx&quot;, &quot;keys&quot;: [[0, 430], [7.467, 430], [7.967, 0]]}, &quot;drawer2&quot;: {&quot;el&quot;: &quot;drawer2&quot;, &quot;kind&quot;: &quot;tx&quot;, &quot;keys&quot;: [[0, 420], [16.317, 420], [16.767, 0]]}, &quot;voile&quot;: {&quot;el&quot;: &quot;of-voile&quot;, &quot;kind&quot;: &quot;op&quot;, &quot;keys&quot;: [[0, 0], [16.317, 0], [16.717, 0.35]]}}};
const $ = id =&gt; document.getElementById(id);
const ease = p =&gt; p &lt; .5 ? 4*p*p*p : 1 - Math.pow(-2*p + 2, 3) / 2;

// --- valeurs initiales de tout ce que la frise modifie (pour pouvoir revenir en arrière)
function lire(id, p){ const e=$(id); if(p===&#x27;text&#x27;) return e.textContent; if(p===&#x27;display&#x27;) return e.style.display; return e.getAttribute(p); }
function ecrire(id, p, v){ const e=$(id); if(!e) return; if(p===&#x27;text&#x27;) e.textContent=v; else if(p===&#x27;display&#x27;) e.style.display=v; else e.setAttribute(p, v); }
const init = {};
D.sets.forEach(([t,id,p]) =&gt; { const k=id+&#x27;|&#x27;+p; if(!(k in init)) init[k]=[id,p,lire(id,p)]; });
D.types.forEach(([s,d,id]) =&gt; { const k=id+&#x27;|text&#x27;; if(!(k in init)) init[k]=[id,&#x27;text&#x27;,lire(id,&#x27;text&#x27;)]; });
const EVTS = [...D.sets.map(([t,id,p,v]) =&gt; [t,&#x27;set&#x27;,id,p,v]), ...D.types.map(([s,d,id,txt]) =&gt; [s,&#x27;type&#x27;,d,id,txt])].sort((a,b) =&gt; a[0]-b[0]);
const ecransIds = [...new Set(D.screens.map(s =&gt; s[1]))];

function valeur(keys, t){
  if (t &lt;= keys[0][0]) return keys[0][1];
  for (let i = 1; i &lt; keys.length; i++){
    const [t1, v1] = keys[i];
    if (t &lt;= t1){
      const [t0, v0] = keys[i-1];
      const p = t1 === t0 ? 1 : ease((t - t0) / (t1 - t0));
      return Array.isArray(v0) ? v0.map((a, j) =&gt; a + (v1[j] - a) * p) : v0 + (v1 - v0) * p;
    }
  }
  return keys[keys.length-1][1];
}

function rendu(t){
  Object.values(init).forEach(([id,p,v]) =&gt; ecrire(id,p,v));
  // écran affiché
  let ecran = null; D.screens.forEach(([ts,id]) =&gt; { if (ts &lt;= t) ecran = id; });
  ecransIds.forEach(id =&gt; { const on = id === ecran; $(id).style.display = on ? &#x27;&#x27; : &#x27;none&#x27;; $(&#x27;h-&#x27;+id).style.display = on ? &#x27;&#x27; : &#x27;none&#x27;; });
  // changements ponctuels et frappe au clavier, dans l&#x27;ordre chronologique
  for (const ev of EVTS){ if (ev[0] &gt; t) break;
    if (ev[1] === &#x27;set&#x27;) ecrire(ev[2], ev[3], ev[4]);
    else { const [s,, d, id, txt] = ev; ecrire(id, &#x27;text&#x27;, txt.slice(0, Math.round(Math.min(1, (t - s) / d) * txt.length))); } }
  // pistes animées
  for (const tr of Object.values(D.tracks)){
    const v = valeur(tr.keys, t), e = $(tr.el); if (!e) continue;
    if (tr.kind===&#x27;ty&#x27;) e.setAttribute(&#x27;transform&#x27;, `translate(0 ${-v})`);
    else if (tr.kind===&#x27;y&#x27;) e.setAttribute(&#x27;transform&#x27;, `translate(0 ${v})`);
    else if (tr.kind===&#x27;tx&#x27;) e.setAttribute(&#x27;transform&#x27;, `translate(${v} 0)`);
    else if (tr.kind===&#x27;op&#x27;) e.setAttribute(&#x27;opacity&#x27;, v);
    else if (tr.kind===&#x27;r&#x27;) e.setAttribute(&#x27;r&#x27;, v);
    else if (tr.kind===&#x27;dash&#x27;) e.setAttribute(&#x27;stroke-dashoffset&#x27;, v);
    else if (tr.kind===&#x27;rot&#x27;) e.setAttribute(&#x27;transform&#x27;, `rotate(${v} ${tr.cx} ${tr.cy})`);
    else if (tr.kind===&#x27;cursor&#x27;) e.setAttribute(&#x27;transform&#x27;, `translate(${v[0]} ${v[1]})`);
  }
  // onde de clic
  const c = $(&#x27;clic&#x27;); c.setAttribute(&#x27;opacity&#x27;, 0);
  D.clicks.forEach(([tc]) =&gt; { const p = (t - tc) / 0.45; if (p &gt;= 0 &amp;&amp; p &lt;= 1){ c.setAttribute(&#x27;r&#x27;, 4 + 16*p); c.setAttribute(&#x27;opacity&#x27;, 1 - p); } });
  document.querySelector(&#x27;#prog i&#x27;).style.width = (100 * t / D.total) + &#x27;%&#x27;;
}

let t = 0, lecture = true, avant = null;
const reduit = window.matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches;
function boucle(ts){
  if (avant !== null &amp;&amp; lecture){ t += (ts - avant) / 1000; if (t &gt; D.total + 1.5) t = 0; }
  avant = ts; rendu(Math.min(t, D.total)); requestAnimationFrame(boucle);
}
function majBouton(){ $(&#x27;lecture&#x27;).textContent = lecture ? &#x27;⏸ Pause&#x27; : &#x27;▶ Lecture&#x27;; $(&#x27;lecture&#x27;).setAttribute(&#x27;aria-label&#x27;, lecture ? &#x27;Pause&#x27; : &#x27;Lecture&#x27;); }
$(&#x27;lecture&#x27;).onclick = () =&gt; { lecture = !lecture; majBouton(); };
$(&#x27;prog&#x27;).onclick = e =&gt; { const r = e.currentTarget.getBoundingClientRect(); t = D.total * (e.clientX - r.left) / r.width; };
window.seek = s =&gt; { t = s; lecture = false; rendu(s); };   // utile pour les tests et l&#x27;intégration
if (reduit){ lecture = false; t = D.total; majBouton(); }   // image finale, sans mouvement
requestAnimationFrame(boucle);
&lt;/script&gt;
