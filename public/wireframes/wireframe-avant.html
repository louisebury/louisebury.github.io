="middle" letter-spacing="0">Voir matchs : 4</text><text x="780" y="638" font-family="Nunito, Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#2B2D33" fill-opacity="1" text-anchor="middle" letter-spacing="0">1</text><text x="930" y="638" font-family="Nunito, Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#2B2D33" fill-opacity="1" text-anchor="middle" letter-spacing="0">2</text><text x="1065" y="638" font-family="Nunito, Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#2B2D33" fill-opacity="1" text-anchor="middle" letter-spacing="0">4</text></g></g></g><g id="h-s-old-form" style="display:none" ><rect x="40" y="122" width="1200" height="56" rx="0" fill="#2B2B2B" /><text x="68" y="158" font-family="Nunito, Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#F25C54" fill-opacity="1" text-anchor="start" letter-spacing="0">upply</text><text x="400" y="156" font-family="Nunito, Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" fill-opacity="1" text-anchor="start" letter-spacing="0">Expédier</text><rect x="490" y="147" width="110" height="7" rx="3.5" fill="#666" /><rect x="630" y="147" width="110" height="7" rx="3.5" fill="#666" /><path d="M910 178 L940 122 H1240 V178 Z" fill="#F25C54"/><rect x="1010" y="147" width="110" height="7" rx="3.5" fill="#FFFFFF" /><path d="M1180 144 q0 -6 6 -6 q6 0 6 6 v8 l3 3 h-18 l3 -3 z" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></g><g id="h-s-old-match" style="display:none" ><rect x="40" y="122" width="1200" height="56" rx="0" fill="#2B2B2B" /><text x="68" y="158" font-family="Nunito, Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#F25C54" fill-opacity="1" text-anchor="start" letter-spacing="0">upply</text><text x="400" y="156" font-family="Nunito, Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" fill-opacity="1" text-anchor="start" letter-spacing="0">Expédier</text><rect x="490" y="147" width="110" height="7" rx="3.5" fill="#666" /><rect x="630" y="147" width="110" height="7" rx="3.5" fill="#666" /><path d="M910 178 L940 122 H1240 V178 Z" fill="#F25C54"/><rect x="1010" y="147" width="110" height="7" rx="3.5" fill="#FFFFFF" /><path d="M1180 144 q0 -6 6 -6 q6 0 6 6 v8 l3 3 h-18 l3 -3 z" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></g><g id="h-s-old-lots" style="display:none" ><rect x="40" y="122" width="1200" height="56" rx="0" fill="#2B2B2B" /><text x="68" y="158" font-family="Nunito, Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#F25C54" fill-opacity="1" text-anchor="start" letter-spacing="0">upply</text><text x="400" y="156" font-family="Nunito, Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" fill-opacity="1" text-anchor="start" letter-spacing="0">Expédier</text><rect x="490" y="147" width="110" height="7" rx="3.5" fill="#666" /><rect x="630" y="147" width="110" height="7" rx="3.5" fill="#666" /><path d="M910 178 L940 122 H1240 V178 Z" fill="#F25C54"/><rect x="1010" y="147" width="110" height="7" rx="3.5" fill="#FFFFFF" /><path d="M1180 144 q0 -6 6 -6 q6 0 6 6 v8 l3 3 h-18 l3 -3 z" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></g></g><g id="toast" opacity="0"><g id="toast-pos"><rect x="420.0" y="706" width="440" height="50" rx="10" fill="#2B2D33" filter="url(#ombre)"/><circle cx="446.0" cy="731" r="10" fill="#2E9E5B"/><path d="M441.0 731 l4 4 l7 -8" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round"/><text id="toast-t" x="466.0" y="736" font-family="Nunito, Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" fill-opacity="1" text-anchor="start" letter-spacing="0"></text></g></g><g id="titre" opacity="0"><rect x="40" y="88" width="1200" height="692" rx="14" fill="#0B0B12" fill-opacity="0.94"/><text id="titre-k" x="640.0" y="408.0" font-family="Nunito, Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#FFC46B" fill-opacity="1" text-anchor="middle" letter-spacing="4"></text><text id="titre-t" x="640.0" y="458.0" font-family="Nunito, Inter, Arial, sans-serif" font-size="38" font-weight="700" fill="#FF4FA0" fill-opacity="1" text-anchor="middle" letter-spacing="0"></text><text id="titre-s" x="640.0" y="496.0" font-family="Nunito, Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#F5F3FF" fill-opacity="0.75" text-anchor="middle" letter-spacing="0"></text></g><g id="curseur"><circle id="clic" cx="0" cy="0" r="0" fill="#F25C54" fill-opacity="0.25" stroke="#F25C54" stroke-width="2" opacity="0"/><path d="M0 0 L0 20 L5.5 15 L9 23 L12.5 21.5 L9 14 L16 14 Z" fill="#FFFFFF" stroke="#111" stroke-width="1.3" stroke-linejoin="round"/></g></svg></div>
<div class="barre">
  <button id="lecture" aria-label="Pause">⏸ Pause</button>
  <div id="prog" aria-hidden="true"><i></i></div>
</div>
<script>
const D = {"total": 17.35, "sets": [[0.0, "titre-k", "text", "AVANT"], [0.0, "titre-t", "text", "L'ancienne Marketplace"], [0.0, "titre-s", "text", "Un formulaire long, puis l'attente d'un « match »"], [7.95, "old-st-1", "fill", "#F25C54"], [7.95, "old-st-1", "stroke", "#F25C54"], [7.95, "old-st-1-t", "fill", "#FFFFFF"], [7.95, "old-st-2", "fill", "#F25C54"], [7.95, "old-st-2", "stroke", "#F25C54"], [7.95, "old-st-2-t", "fill", "#FFFFFF"], [7.95, "old-sec-1", "text", "Livraison"]], "types": [], "screens": [[0.0, "s-old-form"], [10.05, "s-old-match"], [13.35, "s-old-lots"]], "clicks": [[7.6, 1119.0, 496.0]], "tracks": {"curseur": {"el": "curseur", "kind": "cursor", "keys": [[0, [1020, 660]], [2.9, [1020, 660]], [3.7, [340, 478]], [7.0, [340, 478]], [7.6, [1119.0, 496.0]], [13.35, [1119.0, 496.0]], [14.25, [670, 441]], [14.65, [670, 441]], [15.45, [670, 633]]]}, "toast": {"el": "toast", "kind": "op", "keys": [[0, 0]]}, "toast-y": {"el": "toast-pos", "kind": "y", "keys": [[0, 12]]}, "s-old-form": {"el": "s-old-form-defil", "kind": "ty", "keys": [[0, 0], [3.7, 0], [6.9, 900], [7.95, 900], [7.96, 0], [8.25, 0], [9.85, 700]]}, "s-old-lots": {"el": "s-old-lots-defil", "kind": "ty", "keys": [[0, 0]]}, "spinner": {"el": "old-spinner", "kind": "rot", "cx": 640.0, "cy": 458, "keys": [[0, 0], [10.05, 0], [13.25, 720]]}, "titre": {"el": "titre", "kind": "op", "keys": [[0, 0], [0.0, 0], [0.35, 1], [2.4, 1], [2.85, 0]]}}};
const $ = id => document.getElementById(id);
const ease = p => p < .5 ? 4*p*p*p : 1 - Math.pow(-2*p + 2, 3) / 2;

// --- valeurs initiales de tout ce que la frise modifie (pour pouvoir revenir en arrière)
function lire(id, p){ const e=$(id); if(p==='text') return e.textContent; if(p==='display') return e.style.display; return e.getAttribute(p); }
function ecrire(id, p, v){ const e=$(id); if(!e) return; if(p==='text') e.textContent=v; else if(p==='display') e.style.display=v; else e.setAttribute(p, v); }
const init = {};
D.sets.forEach(([t,id,p]) => { const k=id+'|'+p; if(!(k in init)) init[k]=[id,p,lire(id,p)]; });
D.types.forEach(([s,d,id]) => { const k=id+'|text'; if(!(k in init)) init[k]=[id,'text',lire(id,'text')]; });
const EVTS = [...D.sets.map(([t,id,p,v]) => [t,'set',id,p,v]), ...D.types.map(([s,d,id,txt]) => [s,'type',d,id,txt])].sort((a,b) => a[0]-b[0]);
const ecransIds = [...new Set(D.screens.map(s => s[1]))];

function valeur(keys, t){
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++){
    const [t1, v1] = keys[i];
    if (t <= t1){
      const [t0, v0] = keys[i-1];
      const p = t1 === t0 ? 1 : ease((t - t0) / (t1 - t0));
      return Array.isArray(v0) ? v0.map((a, j) => a + (v1[j] - a) * p) : v0 + (v1 - v0) * p;
    }
  }
  return keys[keys.length-1][1];
}

function rendu(t){
  Object.values(init).forEach(([id,p,v]) => ecrire(id,p,v));
  // écran affiché
  let ecran = null; D.screens.forEach(([ts,id]) => { if (ts <= t) ecran = id; });
  ecransIds.forEach(id => { const on = id === ecran; $(id).style.display = on ? '' : 'none'; $('h-'+id).style.display = on ? '' : 'none'; });
  // changements ponctuels et frappe au clavier, dans l'ordre chronologique
  for (const ev of EVTS){ if (ev[0] > t) break;
    if (ev[1] === 'set') ecrire(ev[2], ev[3], ev[4]);
    else { const [s,, d, id, txt] = ev; ecrire(id, 'text', txt.slice(0, Math.round(Math.min(1, (t - s) / d) * txt.length))); } }
  // pistes animées
  for (const tr of Object.values(D.tracks)){
    const v = valeur(tr.keys, t), e = $(tr.el); if (!e) continue;
    if (tr.kind==='ty') e.setAttribute('transform', `translate(0 ${-v})`);
    else if (tr.kind==='y') e.setAttribute('transform', `translate(0 ${v})`);
    else if (tr.kind==='tx') e.setAttribute('transform', `translate(${v} 0)`);
    else if (tr.kind==='op') e.setAttribute('opacity', v);
    else if (tr.kind==='r') e.setAttribute('r', v);
    else if (tr.kind==='dash') e.setAttribute('stroke-dashoffset', v);
    else if (tr.kind==='rot') e.setAttribute('transform', `rotate(${v} ${tr.cx} ${tr.cy})`);
    else if (tr.kind==='cursor') e.setAttribute('transform', `translate(${v[0]} ${v[1]})`);
  }
  // onde de clic
  const c = $('clic'); c.setAttribute('opacity', 0);
  D.clicks.forEach(([tc]) => { const p = (t - tc) / 0.45; if (p >= 0 && p <= 1){ c.setAttribute('r', 4 + 16*p); c.setAttribute('opacity', 1 - p); } });
  document.querySelector('#prog i').style.width = (100 * t / D.total) + '%';
}

let t = 0, lecture = true, avant = null;
const reduit = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function boucle(ts){
  if (avant !== null && lecture){ t += (ts - avant) / 1000; if (t > D.total + 1.5) t = 0; }
  avant = ts; rendu(Math.min(t, D.total)); requestAnimationFrame(boucle);
}
function majBouton(){ $('lecture').textContent = lecture ? '⏸ Pause' : '▶ Lecture'; $('lecture').setAttribute('aria-label', lecture ? 'Pause' : 'Lecture'); }
$('lecture').onclick = () => { lecture = !lecture; pauseVisiteur = !lecture; majBouton(); };
$('prog').onclick = e => { const r = e.currentTarget.getBoundingClientRect(); t = D.total * (e.clientX - r.left) / r.width; };
window.seek = s => { t = s; lecture = false; rendu(s); };   // utile pour les tests et l'intégration
if (reduit){ lecture = false; t = D.total; majBouton(); }   // image finale, sans mouvement
// Intégration dans la page projet (US4.4) : la page envoie « lecture » ou « pause » selon la visibilité.
let pauseVisiteur = false;   // true si le visiteur a mis en pause lui-même avec le bouton
if (window.parent !== window && !reduit){ lecture = false; majBouton(); }   // dans une iframe : on attend « lecture »
window.addEventListener('message', e => {
  if (e.origin !== location.origin) return;   // seulement les messages venant du même site
  if (e.data === 'pause') lecture = false;
  else if (e.data === 'lecture' && !pauseVisiteur && !reduit) lecture = true;
  else return;
  majBouton();
});
requestAnimationFrame(boucle);
</script>
</body></html>
