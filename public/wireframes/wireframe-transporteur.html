78" stroke="#E3E5EA"/><text x="68" y="158" font-family="Nunito, Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#F25C54" fill-opacity="1" text-anchor="start" letter-spacing="0">upply</text><line x1="144" y1="140" x2="144" y2="160" stroke="#E3E5EA" stroke-width="1.5"/><text x="156" y="156" font-family="Nunito, Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#2B2D33" fill-opacity="1" text-anchor="start" letter-spacing="0">Connect</text><text x="280" y="156" font-family="Nunito, Inter, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#2B2D33" fill-opacity="1" text-anchor="start" letter-spacing="0">Rechercher des lots</text><text x="464.4" y="156" font-family="Nunito, Inter, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#F25C54" fill-opacity="1" text-anchor="start" letter-spacing="0">Mes offres</text><rect x="464.4" y="174" width="76.0" height="4" rx="2" fill="#F25C54" /><path d="M1144 144 q0 -6 6 -6 q6 0 6 6 v8 l3 3 h-18 l3 -3 z" fill="none" stroke="#2B2D33" stroke-width="1.6"/><circle cx="1196" cy="150" r="15" fill="#E6F0FD"/><text x="1196" y="154.5" font-family="Nunito, Inter, Arial, sans-serif" font-size="11" font-weight="800" fill="#2F80ED" fill-opacity="1" text-anchor="middle" letter-spacing="0">LB</text></g></g><g id="toast" opacity="0"><g id="toast-pos"><rect x="420.0" y="706" width="440" height="50" rx="10" fill="#2B2D33" filter="url(#ombre)"/><circle cx="446.0" cy="731" r="10" fill="#2E9E5B"/><path d="M441.0 731 l4 4 l7 -8" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round"/><text id="toast-t" x="466.0" y="736" font-family="Nunito, Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" fill-opacity="1" text-anchor="start" letter-spacing="0"></text></g></g><g id="curseur"><circle id="clic" cx="0" cy="0" r="0" fill="#F25C54" fill-opacity="0.25" stroke="#F25C54" stroke-width="2" opacity="0"/><path d="M0 0 L0 20 L5.5 15 L9 23 L12.5 21.5 L9 14 L16 14 Z" fill="#FFFFFF" stroke="#111" stroke-width="1.3" stroke-linejoin="round"/></g></svg></div>
<div class="barre">
  <button id="lecture" aria-label="Pause">⏸ Pause</button>
  <div id="prog" aria-hidden="true"><i></i></div>
</div>
<script>
const D = {"total": 20.72, "sets": [[1.75, "r-pick-ph", "display", "none"], [2.567, "r-liste-tous", "display", "none"], [2.567, "r-liste-fr13", "display", ""], [2.567, "r-compte", "text", "3 lots disponibles"], [4.217, "toast-t", "text", "Recherche sauvegardée : alerte e-mail activée"], [7.467, "r-liste-fr13", "display", "none"], [7.467, "r-liste-compacte", "display", ""], [9.117, "o-prix-ph", "display", "none"], [11.317, "toast-t", "text", "Offre envoyée : le chargeur est notifié"]], "types": [[1.75, 0.667, "r-pick", "FR13"], [9.117, 1.0, "o-prix", "1 250 €"]], "screens": [[0.0, "s-search"], [14.367, "s-offers"]], "clicks": [[1.4, 152, 302.0], [3.867, 215.0, 520.0], [7.117, 1126.0, 289.0], [8.767, 904, 388.0], [10.967, 1015.0, 716.0], [14.017, 502.4, 152], [15.967, 900, 337]], "tracks": {"curseur": {"el": "curseur", "kind": "cursor", "keys": [[0, [1020, 660]], [0.6, [1020, 660]], [1.4, [152, 302.0]], [3.167, [152, 302.0]], [3.867, [215.0, 520.0]], [6.317, [215.0, 520.0]], [7.117, [1126.0, 289.0]], [8.167, [1126.0, 289.0]], [8.767, [904, 388.0]], [10.267, [904, 388.0]], [10.967, [1015.0, 716.0]], [13.217, [1015.0, 716.0]], [14.017, [502.4, 152]], [15.167, [502.4, 152]], [15.967, [900, 337]], [17.117, [900, 337]], [18.017, [1040.0, 736.0]]]}, "toast": {"el": "toast", "kind": "op", "keys": [[0, 0], [4.217, 0], [4.517, 1], [6.617, 1], [7.017, 0], [11.317, 0], [11.617, 1], [13.717, 1], [14.117, 0]]}, "toast-y": {"el": "toast-pos", "kind": "y", "keys": [[0, 12], [4.217, 12], [4.517, 0], [7.017, 0], [7.027, 12], [11.317, 12], [11.617, 0], [14.117, 0], [14.127, 12]]}, "s-search": {"el": "s-search-defil", "kind": "ty", "keys": [[0, 0]]}, "s-offers": {"el": "s-offers-defil", "kind": "ty", "keys": [[0, 0]]}, "drawer1": {"el": "drawer1", "kind": "tx", "keys": [[0, 430], [7.467, 430], [7.967, 0]]}, "drawer2": {"el": "drawer2", "kind": "tx", "keys": [[0, 420], [16.317, 420], [16.767, 0]]}, "voile": {"el": "of-voile", "kind": "op", "keys": [[0, 0], [16.317, 0], [16.717, 0.35]]}}};
const $ = id => document.getElementById(id);
const ease = p => p < .5 ? 4*p*p*p : 1 - Math.pow(-2*p + 2, 3) / 2;

// --- valeurs initiales de tout ce que la frise modifie (pour pouvoir revenir en arrière)
function lire(id, p){ const e=$(id); if(p==='text') return e.textContent; if(p==='display') return e.style.display; return e.getAttribute(p); }
function ecrire(id, p, v){ const e=$(id); if(!e) return; if(p==='text') e.textContent=v; else if(p==='display') e.style.display=v; else e.setAttribute(p, v); }
const init = {};
D.sets.forEach(([t,id,p]) => { const k=id+'|'+p; if(!(k in init)) init[k]=[id,p,lire(id,p)]; });
D.types.forEach(([s,d,id]) => { const k=id+'|text'; if(!(k in init)) init[k]=[id,'text',lire(id,'text')]; });
const EVTS = [...D.sets.map(([t,id,p,v]) => [t,'set',id,p,v]), ...D.types.map(([s,d,id,txt]) => [s,'type',d,id,txt])].sort((a,b) => a[0]-b[0]);
const ecransIds = [...new Set(D.screens.map(s => s[1]))];

function valeur(keys, t){
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++){
    const [t1, v1] = keys[i];
    if (t <= t1){
      const [t0, v0] = keys[i-1];
      const p = t1 === t0 ? 1 : ease((t - t0) / (t1 - t0));
      return Array.isArray(v0) ? v0.map((a, j) => a + (v1[j] - a) * p) : v0 + (v1 - v0) * p;
    }
  }
  return keys[keys.length-1][1];
}

function rendu(t){
  Object.values(init).forEach(([id,p,v]) => ecrire(id,p,v));
  // écran affiché
  let ecran = null; D.screens.forEach(([ts,id]) => { if (ts <= t) ecran = id; });
  ecransIds.forEach(id => { const on = id === ecran; $(id).style.display = on ? '' : 'none'; $('h-'+id).style.display = on ? '' : 'none'; });
  // changements ponctuels et frappe au clavier, dans l'ordre chronologique
  for (const ev of EVTS){ if (ev[0] > t) break;
    if (ev[1] === 'set') ecrire(ev[2], ev[3], ev[4]);
    else { const [s,, d, id, txt] = ev; ecrire(id, 'text', txt.slice(0, Math.round(Math.min(1, (t - s) / d) * txt.length))); } }
  // pistes animées
  for (const tr of Object.values(D.tracks)){
    const v = valeur(tr.keys, t), e = $(tr.el); if (!e) continue;
    if (tr.kind==='ty') e.setAttribute('transform', `translate(0 ${-v})`);
    else if (tr.kind==='y') e.setAttribute('transform', `translate(0 ${v})`);
    else if (tr.kind==='tx') e.setAttribute('transform', `translate(${v} 0)`);
    else if (tr.kind==='op') e.setAttribute('opacity', v);
    else if (tr.kind==='r') e.setAttribute('r', v);
    else if (tr.kind==='dash') e.setAttribute('stroke-dashoffset', v);
    else if (tr.kind==='rot') e.setAttribute('transform', `rotate(${v} ${tr.cx} ${tr.cy})`);
    else if (tr.kind==='cursor') e.setAttribute('transform', `translate(${v[0]} ${v[1]})`);
  }
  // onde de clic
  const c = $('clic'); c.setAttribute('opacity', 0);
  D.clicks.forEach(([tc]) => { const p = (t - tc) / 0.45; if (p >= 0 && p <= 1){ c.setAttribute('r', 4 + 16*p); c.setAttribute('opacity', 1 - p); } });
  document.querySelector('#prog i').style.width = (100 * t / D.total) + '%';
}

let t = 0, lecture = true, avant = null;
const reduit = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function boucle(ts){
  if (avant !== null && lecture){ t += (ts - avant) / 1000; if (t > D.total + 1.5) t = 0; }
  avant = ts; rendu(Math.min(t, D.total)); requestAnimationFrame(boucle);
}
function majBouton(){ $('lecture').textContent = lecture ? '⏸ Pause' : '▶ Lecture'; $('lecture').setAttribute('aria-label', lecture ? 'Pause' : 'Lecture'); }
$('lecture').onclick = () => { lecture = !lecture; majBouton(); };
$('prog').onclick = e => { const r = e.currentTarget.getBoundingClientRect(); t = D.total * (e.clientX - r.left) / r.width; };
window.seek = s => { t = s; lecture = false; rendu(s); };   // utile pour les tests et l'intégration
if (reduit){ lecture = false; t = D.total; majBouton(); }   // image finale, sans mouvement
requestAnimationFrame(boucle);
</script>
